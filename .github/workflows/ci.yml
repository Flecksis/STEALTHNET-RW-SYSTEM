name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sn_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sh tests/install/scenarios.sh sh
      - run: bash tests/install/scenarios.sh bash
      - run: python3 tests/install/dialog.py sh bash

  install-early:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      LOGIN_URL: http://127.0.0.1:8080/api/admin/auth/login
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: install before this commit has an image
        run: SN_OWNER_EMAIL=owner@example.com SN_DOMAIN=panel.localhost ./install.sh | tee "$RUNNER_TEMP/install.log"
      - name: a published image was used and it works
        run: |
          grep -q 'готовая сборка скачана' "$RUNNER_TEMP/install.log"
          if docker image inspect stealthnet:local >/dev/null 2>&1; then exit 1; fi
          password=$(sed -n 's/^ *Пароль владельца: *//p' "$RUNNER_TEMP/install.log" | tail -n 1)
          test "${#password}" -eq 20
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" "$LOGIN_URL"

  install-root:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: install
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      LOGIN_URL: http://127.0.0.1:8080/api/admin/auth/login
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: install as root
        run: sudo SN_OWNER_EMAIL=owner@example.com SN_DOMAIN=panel.localhost ./install.sh | tee "$RUNNER_TEMP/install.log"
      - name: the stealthnet command works from any folder
        run: |
          grep -q 'готовая сборка скачана' "$RUNNER_TEMP/install.log"
          grep -q '^  stealthnet reset-password$' "$RUNNER_TEMP/install.log"
          test -x /usr/local/bin/stealthnet
          cd /
          sudo stealthnet reset-password | tee "$RUNNER_TEMP/reset.log"
          password=$(sed -n 's/^ *Пароль владельца: *//p' "$RUNNER_TEMP/reset.log" | tail -n 1)
          test "${#password}" -eq 20
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" "$LOGIN_URL"
      - name: the domain answers over HTTPS
        run: |
          set -x
          grep -q 'сертификат выпущен, https://panel.localhost открывается' "$RUNNER_TEMP/install.log"
          site="--resolve panel.localhost:443:127.0.0.1 --resolve panel.localhost:80:127.0.0.1"
          test "$(curl -sk $site https://panel.localhost/api/health)" = '{"status":"ok"}'
          curl -sk $site https://panel.localhost/ | grep -q 'STEALTHNET'
          test "$(curl -s -o /dev/null -w '%{http_code}' $site http://panel.localhost/)" = 308
          password=$(sed -n 's/^ *Пароль владельца: *//p' "$RUNNER_TEMP/reset.log" | tail -n 1)
          curl -fsSk $site -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" https://panel.localhost/api/admin/auth/login
          if (cd deploy && sudo docker compose logs app) | grep -Eq 'нет в SN_TRUSTED_PROXIES|он не в SN_TRUSTED_PROXIES'; then exit 1; fi
      - name: the domain can be changed
        run: |
          set -x
          cd /
          sudo SN_DOMAIN=short.localhost stealthnet domain | tee "$RUNNER_TEMP/domain.log"
          sudo grep -q '^SN_PUBLIC_URL=https://short.localhost$' "$GITHUB_WORKSPACE/deploy/.env"
          grep -q 'сертификат выпущен, https://short.localhost открывается' "$RUNNER_TEMP/domain.log"
          site="--resolve short.localhost:443:127.0.0.1"
          test "$(curl -sk $site https://short.localhost/api/health)" = '{"status":"ok"}'
          curl -fsS http://127.0.0.1:8080/api/health

  install:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      LOGIN_URL: http://127.0.0.1:8080/api/admin/auth/login
      IMAGE: ghcr.io/stealthnet-app/stealthnet-rw-system
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install from source
        run: SN_BUILD=1 SN_OWNER_EMAIL=owner@example.com SN_DOMAIN=panel.localhost ./install.sh | tee "$RUNNER_TEMP/install.log"
      - name: sign in with the generated password
        run: |
          password=$(sed -n 's/^ *Пароль владельца: *//p' "$RUNNER_TEMP/install.log" | tail -n 1)
          test "${#password}" -eq 20
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" "$LOGIN_URL"
          printf '%s' "$password" > "$RUNNER_TEMP/password.txt"
          curl -fsS http://127.0.0.1:8080/admin | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/public/site | grep -q '"appearance"'
      - name: rerun keeps secrets and the owner
        run: |
          cp deploy/.env "$RUNNER_TEMP/before.env"
          SN_BUILD=1 SN_OWNER_EMAIL=other@example.com ./install.sh | tee "$RUNNER_TEMP/rerun.log"
          cmp deploy/.env "$RUNNER_TEMP/before.env"
          grep -q 'уже создан: owner@example.com' "$RUNNER_TEMP/rerun.log"
          if grep -q 'Пароль владельца:' "$RUNNER_TEMP/rerun.log"; then exit 1; fi
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$(cat "$RUNNER_TEMP/password.txt")\"}" "$LOGIN_URL"
      - name: reset the owner password
        run: |
          ./install.sh --reset-password | tee "$RUNNER_TEMP/reset.log"
          old=$(cat "$RUNNER_TEMP/password.txt")
          password=$(sed -n 's/^ *Пароль владельца: *//p' "$RUNNER_TEMP/reset.log" | tail -n 1)
          test "${#password}" -eq 20
          test "$password" != "$old"
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" "$LOGIN_URL"
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$old\"}" "$LOGIN_URL")
          test "$status" = 401
          printf '%s' "$password" > "$RUNNER_TEMP/password.txt"
      - name: change the owner e-mail and the domain
        run: |
          password=$(cat "$RUNNER_TEMP/password.txt")
          SN_OWNER_EMAIL="o'brien@example.org" ./install.sh --owner-email
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"o'brien@example.org\",\"password\":\"$password\"}" "$LOGIN_URL"
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" "$LOGIN_URL")
          test "$status" = 401
          SN_DOMAIN=new.localhost ./install.sh --domain
          grep -q '^SN_PUBLIC_URL=https://new.localhost$' deploy/.env
          test "$(cd deploy && docker compose exec -T app printenv SN_PUBLIC_URL)" = "https://new.localhost"
          curl -fsS http://127.0.0.1:8080/api/health
      - name: publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag stealthnet:local "$IMAGE:sha-$GITHUB_SHA"
          docker tag stealthnet:local "$IMAGE:main"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:main"

  install-prebuilt:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: install
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      LOGIN_URL: http://127.0.0.1:8080/api/admin/auth/login
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: the registry holds no saved sign-in
        run: |
          docker logout ghcr.io
          if grep -q 'ghcr.io' "$HOME/.docker/config.json" 2>/dev/null; then exit 1; fi
      - name: install from the published image
        run: |
          started=$SECONDS
          SN_OWNER_EMAIL=owner@example.com SN_DOMAIN=panel.localhost ./install.sh | tee "$RUNNER_TEMP/install.log"
          echo "install took $((SECONDS - started)) seconds"
      - name: the published image was used and it works
        run: |
          grep -q 'готовая сборка скачана' "$RUNNER_TEMP/install.log"
          if docker image inspect stealthnet:local >/dev/null 2>&1; then exit 1; fi
          password=$(sed -n 's/^ *Пароль владельца: *//p' "$RUNNER_TEMP/install.log" | tail -n 1)
          test "${#password}" -eq 20
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" "$LOGIN_URL"

  install-updater:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: install
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      URL: http://127.0.0.1:8080
      PUBLISHED: ghcr.io/stealthnet-app/stealthnet-rw-system
      LOCAL: localhost:5000/stealthnet-rw-system
      NEXT: "0000000000000000000000000000000000000001"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: a local registry with this build and a newer one
        run: |
          set -x
          docker run -d --name registry -p 5000:5000 registry:2
          sleep 3
          docker pull "$PUBLISHED:sha-$GITHUB_SHA"
          docker tag "$PUBLISHED:sha-$GITHUB_SHA" "$LOCAL:sha-$GITHUB_SHA"
          docker push "$LOCAL:sha-$GITHUB_SHA"
          later=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)
          printf 'FROM %s\nLABEL org.opencontainers.image.revision=%s org.opencontainers.image.created=%s org.opencontainers.image.version=0.1.99999\nENV SN_BUILD_COMMIT=%s SN_BUILD_DATE=%s SN_BUILD_VERSION=0.1.99999\n' \
            "$PUBLISHED:sha-$GITHUB_SHA" "$NEXT" "$later" "$NEXT" "$later" > "$RUNNER_TEMP/next.Dockerfile"
          test -n "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$PUBLISHED:sha-$GITHUB_SHA")"
          docker build -t "$LOCAL:main" -f "$RUNNER_TEMP/next.Dockerfile" "$RUNNER_TEMP"
          docker push "$LOCAL:main"
          docker image rm "$LOCAL:main" "$LOCAL:sha-$GITHUB_SHA" "$PUBLISHED:sha-$GITHUB_SHA"
      - name: install as root from a folder only root can change
        run: |
          set -x
          sudo cp -a "$GITHUB_WORKSPACE" /opt/stealthnet-rw
          sudo chown -R root:root /opt/stealthnet-rw
          sudo chmod -R go-w /opt/stealthnet-rw
          host=$(hostname -I | awk '{print $1}')
          printf 'SN_UPDATE_REGISTRY=http://%s:5000\nSN_UPDATE_REPOSITORY=stealthnet-rw-system\n' "$host" | sudo tee /opt/stealthnet-rw/deploy/.env
          sudo chmod 600 /opt/stealthnet-rw/deploy/.env
          cd /
          sudo SN_IMAGE_REPO="$LOCAL" SN_OWNER_EMAIL=owner@example.com SN_DOMAIN=panel.localhost /opt/stealthnet-rw/install.sh | tee "$RUNNER_TEMP/install.log"
          grep -q 'включено, обновлять может только владелец с паролем' "$RUNNER_TEMP/install.log"
          systemctl is-active stealthnet-rw-update.path
          systemctl is-enabled stealthnet-rw-recover.service
          sudo grep -q '"panel_updates":true' /var/lib/stealthnet-rw/ipc/status/helper.json
      - name: the owner updates from the admin panel and systemd runs the helper
        run: |
          set -x
          password=$(sed -n 's/^ *Пароль владельца: *//p' "$RUNNER_TEMP/install.log" | tail -n 1)
          token=$(curl -fsS -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" "$URL/api/admin/auth/login" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$token"
          auth="Authorization: Bearer $token"
          curl -fsS -H "$auth" -X POST -H 'content-type: application/json' -d '{}' "$URL/api/admin/system/check" | tee "$RUNNER_TEMP/check.json"
          grep -q "\"latest\":{\"label\":\"0.1.99999\",\"commit\":\"$NEXT\"" "$RUNNER_TEMP/check.json"
          grep -q '"current":{"version":"[0-9.]*","label":"[0-9]*\.[0-9]*\.[0-9]*"' "$RUNNER_TEMP/check.json"
          grep -q '"can_update":true' "$RUNNER_TEMP/check.json"
          code=$(curl -s -H "$auth" -o "$RUNNER_TEMP/request.json" -w '%{http_code}' -H 'content-type: application/json' \
            -d "{\"target\":\"$NEXT\",\"password\":\"$password\"}" "$URL/api/admin/system/update")
          cat "$RUNNER_TEMP/request.json"
          test "$code" = 202
          for i in $(seq 1 100); do
            state=$(sudo sed -n 's/.*"state":"\([a-z_]*\)","steps".*/\1/p' /var/lib/stealthnet-rw/ipc/status/update.json 2>/dev/null || true)
            case "$state" in
              done|failed|rolled_back|attention) break ;;
            esac
            sleep 3
          done
          sudo cat /var/lib/stealthnet-rw/ipc/status/update.json
          sudo journalctl -u stealthnet-rw-update.service --no-pager | tail -n 30
          test "$state" = done
          sudo grep -q "^SN_IMAGE=$LOCAL@sha256:" /opt/stealthnet-rw/deploy/.env
          curl -fsS "$URL/api/health"
          token=$(curl -fsS -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$password\"}" "$URL/api/admin/auth/login" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$token"
          curl -fsS -H "Authorization: Bearer $token" "$URL/api/admin/system" | tee "$RUNNER_TEMP/after.json"
          grep -q "\"label\":\"0.1.99999\",\"commit\":\"$NEXT\"" "$RUNNER_TEMP/after.json"
          grep -q '"update":{[^}]*"state":"done"' "$RUNNER_TEMP/after.json"
          test "$(sudo docker exec "$(cd /opt/stealthnet-rw/deploy && sudo docker compose ps -q postgres)" psql -U stealthnet -d postgres -Atc "SELECT count(*) FROM pg_database WHERE datname = 'stealthnet_prev'")" = 1
          sudo ls /opt/stealthnet-rw/deploy/backups/ | grep -q '\.dump$'
          sudo stealthnet status | tee "$RUNNER_TEMP/status.log"
          grep -q 'Последнее обновление: .*установлено (версия 0.1.99999)' "$RUNNER_TEMP/status.log"
          grep -q 'Версия:            0.1.99999 от ' "$RUNNER_TEMP/status.log"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, test, web, installer, install-early, install, install-root, install-prebuilt, install-updater]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: publish the release with its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/release.sh "$GITHUB_SHA"
